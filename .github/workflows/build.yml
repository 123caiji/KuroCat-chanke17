name: Build KuroCat (macOS & Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build standalone KuroCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          dir KuroCat.exe

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-Windows-x64
          path: windows/KuroCat.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow for AppIcon generation
        run: python3 -m pip install --quiet pillow

      - name: Build KuroCat.app
        run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent KuroCat.app KuroCat-macOS-arm64.zip
          ls -lh KuroCat-macOS-arm64.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroCat-macOS-arm64
          path: KuroCat-macOS-arm64.zip

  release:
    needs: [ build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KuroCat-Windows-x64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: KuroCat-macOS-arm64
          path: dist

      - name: Rename Windows binary
        run: mv dist/KuroCat.exe dist/KuroCat-Windows-x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KuroCat-Windows-x64.exe
            dist/KuroCat-macOS-arm64.zip
